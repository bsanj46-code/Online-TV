<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Онлайн ТВ</title><style>body{margin:0;background:#101521;color:#fff;font:16px system-ui}header{padding:18px;background:#202b45;font-size:23px}main{padding:12px}video{width:100%;aspect-ratio:16/9;background:black;border-radius:12px}input{padding:13px;width:100%;box-sizing:border-box;background:#252e42;color:white;border:1px solid #65718c;border-radius:10px;margin:12px 0}.item{display:flex;align-items:center;background:#20283b;border-radius:10px;margin:6px 0}.item button{border:0;background:none;color:white;padding:14px;text-align:left;font-size:16px}.item .play{flex:1}.item .star{font-size:24px;color:#ffd34c}.muted{color:#a9b4c9;font-size:13px}#status{padding:8px}</style></head><body><header>📺 Онлайн ТВ</header><main><video id="v" controls playsinline></video><div id="status">Оберіть канал</div><input id="q" placeholder="🔎 Пошук каналу"><div id="list"></div><p class="muted">Власник і розробник — Башаєв О.С. Наявність каналу не гарантує доступність потоку.</p></main><script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script><script>const names=["Факти ICTV","ICTV2","Мега","2+2","Новий канал","НСТ","Шокуюче HD","Кінопрем’єра","Кіномікс","Кінокомедія","Єврокіно","Чоловіче кіно","Кіносім’я","Кінопобачення","viju+ Premiere","viju+ Megahit","viju+ Comedy","Дом кіно Преміум","TV1000","Кінохіт","Discovery Channel","T24 — Технології","Перший автомобільний","Кіно жахів","Наука","TV1000 Action","РАЗ 3 — Гумор","1+1 Україна","Інтер","ТЕТ","К1","НТН","Enter-фільм","М1"];const urls={"Мега":"https://cdn15.live-tv.cloud/ua_infinitas_tv/mega-abr/playlist.m3u8","НТН":"https://cdn15.live-tv.cloud/ua_infinitas_tv/ntn-abr/playlist.m3u8","TV1000 Action":"https://stream8.cinerama.uz/1225/tracks-v1a1/mono.m3u8","РАЗ 3 — Гумор":"https://dash2.antik.sk/live/kvartal_tv/playlist.m3u8","Наука":"http://stream.mcquack.net/403/index.m3u8","Факти ICTV":"http://stream.mcquack.net/158/index.m3u8","ICTV2":"http://stream.mcquack.net/368/index.m3u8","2+2":"http://stream.mcquack.net/173/index.m3u8","Новий канал":"http://stream.mcquack.net/157/index.m3u8","1+1 Україна":"http://stream.mcquack.net/219/index.m3u8","Інтер":"http://stream.mcquack.net/174/index.m3u8","ТЕТ":"http://stream.mcquack.net/338/index.m3u8","К1":"http://stream.mcquack.net/270/index.m3u8","Enter-фільм":"http://stream.mcquack.net/322/index.m3u8","М1":"http://stream.mcquack.net/218/index.m3u8"};const list=document.getElementById('list'),q=document.getElementById('q'),v=document.getElementById('v'),status=document.getElementById('status');let fav=new Set(JSON.parse(localStorage.getItem('fav')||'[]')),hls;function render(){list.replaceChildren();names.filter(n=>n.toLowerCase().includes(q.value.toLowerCase())).sort((a,b)=>Number(fav.has(b))-Number(fav.has(a))).forEach(n=>{let row=document.createElement('div');row.className='item';let p=document.createElement('button');p.className='play';p.textContent=n;p.onclick=()=>{if(hls){hls.destroy();hls=null}v.pause();v.removeAttribute('src');v.load();let url=urls[n];if(!url){status.textContent='Потік ще не підключений';return}status.textContent=n+' — підключення…';if(window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(url);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));hls.on(Hls.Events.ERROR,(_,e)=>{if(e.fatal)status.textContent='Потік недоступний'});}else{v.src=url;v.play().catch(()=>{})}};let s=document.createElement('button');s.className='star';s.textContent=fav.has(n)?'★':'☆';s.onclick=()=>{fav.has(n)?fav.delete(n):fav.add(n);localStorage.setItem('fav',JSON.stringify([...fav]));render()};row.append(p,s);list.append(row)})}q.oninput=render;render();</script></body></html>
