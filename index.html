const $=id=>document.getElementById(id), list=$('list'),q=$('q'),v=$('v'),status=$('status'),playerWrap=$('playerwrap'),fullscreenBtn=$('fullscreenbtn'),playPauseBtn=$('playpausebtn'),prevChannelBtn=$('prevchannelbtn'),nextChannelBtn=$('nextchannelbtn');
const native=()=>!!window.Capacitor?.isNativePlatform?.();
const normalize=s=>s.replace(/\s*\((?:\d+p|HD|SD|4K)\)\s*$/i,'').toLowerCase().normalize('NFKD').replace(/[’'‘]/g,'').replace(/[^a-z0-9а-яіїєґ]+/g,'');
const aliases={'Факти ICTV':['ictv','факти ictv новини'],'Новий канал':['novy kanal','novyi kanal'],'Мега':['mega'],'1+1 Україна':['1+1 ukraina'],'2+2':['2plus2']};
let remoteChannels=[],fav=new Set(),active='',hls=null,session=0,attempt=0,sourceTimer=null,stallTimer=null;
try{const a=JSON.parse(localStorage.getItem('fav')||'[]');if(Array.isArray(a))fav=new Set(a)}catch{}
const failures=new Set();
function matching(n){const keys=[n,...(aliases[n]||[])].map(normalize);return remoteChannels.filter(c=>keys.includes(normalize(c.name))).map(c=>c.url)}
function candidates(n){return [...new Set([urls[n],...(backups[n]||[]),...matching(n)].filter(u=>u&&(native()||u.startsWith('https://'))))]}
function reset(){clearTimeout(sourceTimer);clearTimeout(stallTimer);sourceTimer=stallTimer=null;v.onerror=null;v.onplaying=null;v.onwaiting=null;v.onstalled=null;if(hls){hls.destroy();hls=null}v.pause();v.removeAttribute('src');v.load()}
function render(){list.replaceChildren();const shown=names.filter(n=>normalize(n).includes(normalize(q.value)));shown.sort((a,b)=>Number(fav.has(b))-Number(fav.has(a))||names.indexOf(a)-names.indexOf(b));for(const n of shown){const row=document.createElement('div');row.className='item'+(active===n?' selected':'');const button=document.createElement('button');button.className='play';button.textContent=n+(failures.has(n)?' · повторити ↻':'');button.onclick=()=>play(n);const star=document.createElement('button');star.className='star';star.textContent=fav.has(n)?'★':'☆';star.setAttribute('aria-label',(fav.has(n)?'Прибрати з обраного: ':'В обране: ')+n);star.onclick=()=>{fav.has(n)?fav.delete(n):fav.add(n);try{localStorage.setItem('fav',JSON.stringify([...fav]))}catch{}render()};row.append(button,star);list.append(row)}if(!shown.length)list.textContent='Каналів не знайдено'}
let overlayTimer=null;function showOverlay(){playerWrap.classList.remove('controls-hidden');clearTimeout(overlayTimer);overlayTimer=setTimeout(()=>playerWrap.classList.add('controls-hidden'),3500)}function switchChannel(delta){const i=names.indexOf(active);play(names[(i<0?0:(i+delta+names.length)%names.length)]);showOverlay()}prevChannelBtn.onclick=e=>{e.stopPropagation();switchChannel(-1)};nextChannelBtn.onclick=e=>{e.stopPropagation();switchChannel(1)};playerWrap.addEventListener('pointerdown',showOverlay);function play(n){showOverlay();const token=++session;active=n;failures.delete(n);reset();render();const sources=candidates(n);let index=0;
 if(native()){if(!sources.length){status.textContent=n+' — джерело тимчасово недоступне';return}window.Capacitor.Plugins.NativeTv.play({url:sources[0],urls:sources,name:n}).then(()=>{if(token===session)status.textContent=n+' — відкрито у плеєрі'}).catch(()=>{if(token===session)status.textContent=n+' — не вдалося відкрити. Натисніть канал повторно.'});return}
 function next(){if(token!==session)return;const current=++attempt;reset();const valid=()=>token===session&&current===attempt;

 const url=sources[index++];status.textContent=n+' — підключення '+index+'/'+sources.length+'…';sourceTimer=setTimeout(()=>{if(valid())next()},20000);

 const start=()=>{if(!valid())return;v.play().catch(e=>{if(!valid())return;if(e.name==='NotAllowedError'){clearTimeout(sourceTimer);status.textContent=n+' — натисніть ▶ для відтворення'}else if(e.name!=='AbortError')next()})};
 if(window.Hls?.isSupported()){const instance=new Hls({maxBufferLength:20,backBufferLength:10,enableWorker:true});hls=instance;let recovered=false;instance.on(Hls.Events.MANIFEST_PARSED,start);instance.on(Hls.Events.ERROR,(_,e)=>{if(!valid()||!e.fatal)return;if(e.type===Hls.ErrorTypes.MEDIA_ERROR&&!recovered){recovered=true;instance.recoverMediaError()}else next()});instance.attachMedia(v);instance.loadSource(url)}else if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=url;start()}else{clearTimeout(sourceTimer);status.textContent='Цей браузер не підтримує HLS. Оновіть браузер.'}

async function refreshIptv(){try{let items=[];if(native())items=(await window.Capacitor.Plugins.NativeTv.playlist()).channels||[];else{const r=await fetch(playlistUrl,{cache:'no-store',signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error();let name='';for(let line of (await r.text()).split(/\r?\n/)){line=line.trim();if(line.startsWith('#EXTINF:'))name=line.split(',').slice(1).join(',').trim();else if(name&&/^https?:\/\//.test(line)){items.push({name,url:line});name=''}}}remoteChannels=items.filter(c=>c.name&&/^https?:\/\//.test(c.url));$('iptvstatus').textContent=names.length+' каналів · резервні джерела оновлено';render()}catch{$('iptvstatus').textContent=names.length+' каналів · основні джерела доступні, резервний каталог тимчасово не оновлено'}}

function exitFullscreen(){playerWrap.classList.remove('web-fullscreen','fill-screen');document.body.classList.remove('web-fullscreen-active');try{screen.orientation?.unlock?.()}catch{}updateFullscreen()}
fullscreenBtn.onclick=async()=>{if(document.fullscreenElement||playerWrap.classList.contains('web-fullscreen')){if(document.fullscreenElement)await document.exitFullscreen().catch(()=>{});exitFullscreen();return}playerWrap.classList.add('web-fullscreen','fill-screen');document.body.classList.add('web-fullscreen-active');try{await playerWrap.requestFullscreen?.({navigationUI:'hide'})}catch{}try{await screen.orientation?.lock?.('landscape')}catch{}updateFullscreen()};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)exitFullscreen();updateFullscreen()});document.addEventListener('keydown',e=>{if(e.key==='Escape')exitFullscreen()});playPauseBtn.onclick=()=>{if(v.paused)v.play().catch(()=>{status.textContent='Натисніть канал для повторного запуску'});else v.pause()};v.addEventListener('play',()=>{playPauseBtn.textContent='⏸'});v.addEventListener('pause',()=>{playPauseBtn.textContent='▶'});q.oninput=render;window.addEventListener('pagehide',()=>{session++;reset()});render();refreshIptv();showOverlay();
