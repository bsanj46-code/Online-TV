<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Онлайн ТВ</title><style>body{margin:0;background:#101521;color:#fff;font:16px system-ui}header{padding:18px;background:#202b45;font-size:23px}main{padding:12px}video{width:100%;aspect-ratio:16/9;background:black;border-radius:12px}body.tv-landscape{overflow:hidden}body.tv-landscape #v:not(:fullscreen){position:fixed;inset:0;width:100vw;height:100dvh;aspect-ratio:auto;object-fit:contain;border-radius:0;background:#000;z-index:9999}#v:fullscreen{width:100vw;height:100dvh;object-fit:contain;border-radius:0;background:#000} #playerwrap{position:relative}#fullscreenbtn{position:absolute;right:10px;bottom:12px;z-index:3;background:#18243bcc;color:white;border:1px solid #ffffff88;border-radius:8px;font-size:27px;line-height:1;padding:7px 11px;cursor:pointer}#playerwrap:fullscreen,#playerwrap.web-fullscreen{background:black;display:flex;align-items:center;justify-content:center}#playerwrap.web-fullscreen{position:fixed;inset:0;width:100vw;height:100dvh;z-index:10000;border-radius:0}#playerwrap.web-fullscreen video{width:100%;height:100%;object-fit:contain;border-radius:0}#playerwrap.web-fullscreen.fill-screen video{object-fit:fill}#playerwrap.web-fullscreen #fullscreenbtn{right:20px;bottom:22px}body.web-fullscreen-active{overflow:hidden}#playerwrap:fullscreen video{width:100%;height:100%;object-fit:contain;border-radius:0}#playerwrap:fullscreen.fill-screen video{object-fit:fill}#playerwrap.fill-screen video{object-fit:fill}#playerwrap:fullscreen #fullscreenbtn{bottom:22px;right:20px}input{padding:13px;width:100%;box-sizing:border-box;background:#252e42;color:white;border:1px solid #65718c;border-radius:10px;margin:12px 0}.item{display:flex;align-items:center;background:#20283b;border-radius:10px;margin:6px 0}.item button{border:0;background:none;color:white;padding:14px;text-align:left;font-size:16px}.item .play{flex:1}.item .star{font-size:24px;color:#ffd34c}.muted{color:#a9b4c9;font-size:13px}#status{padding:8px}@media (orientation:landscape) and (max-height:600px){body:has(video.is-playing) header,body:has(video.is-playing) main>:not(video){display:none!important}body:has(video.is-playing) main{padding:0}body:has(video.is-playing) video{position:fixed;inset:0;width:100vw;height:100dvh;max-height:100dvh;aspect-ratio:auto;object-fit:contain;border-radius:0;background:#000;z-index:9999}}</style></head><body><header>📺 Онлайн ТВ</header><main><div id="playerwrap"><video id="v" controls playsinline></video><button id="fullscreenbtn" type="button" aria-label="На весь екран" title="На весь екран">⛶</button></div><div id="status">Оберіть канал</div><input id="q" placeholder="🔎 Пошук каналу"><button id="loadiptv" style="width:100%;padding:14px;background:#294c79;color:white;border:0;border-radius:10px;font-size:16px;margin-bottom:12px">📡 Завантажити канали IPTV України</button><div id="iptvstatus" class="muted"></div><div id="list"></div><p class="muted">Власник і розробник — Башаєв О.С. Наявність каналу не гарантує доступність потоку.</p></main><script src="hls.min.js"></script><script>const names=["Факти ICTV","ICTV2","Мега","2+2","Новий канал","НСТ","Шокуюче HD","Кінопрем’єра","Кіномікс","Кінокомедія","Єврокіно","Чоловіче кіно","Кіносім’я","Кінопобачення","viju+ Premiere","viju+ Megahit","viju+ Comedy","Дом кіно Преміум","TV1000","Кінохіт","Discovery Channel","T24 — Технології","Перший автомобільний","Кіно жахів","Наука","TV1000 Action","РАЗ 3 — Гумор","1+1 Україна","Інтер","ТЕТ","К1","НТН","Enter-фільм","М1","Перший","Армія ТБ","Піксель TV","Суспільне Київ","ДІМ","ГІТ","Телеканал РАІ","Суспільне Культура","Суспільне Спорт","Київ 24","Тернопіль 1","Перший міський Одеса"];const urls={"Суспільне Культура":"http://stream.mcquack.net/435/index.m3u8","Суспільне Спорт":"http://cdnua05.hls.tv/934/hls/8743361621b245838bee193c9ec28322/4856/stream.m3u8","Київ 24":"https://ext.cdn.nashnet.tv/228.0.0.15/index.m3u8","Тер atus);let txt=await response.text();items=[];let name=null;for(let line of txt.split(/\r?\n/)){line=line.trim();if(line.startsWith('#EXTINF:'))name=line.split(',').slice(1).join(',').trim();else if(name&&/^https?:\/\//.test(line)){items.push({name,url:line});name=null;}}}remoteChannels=(items||[]).filter(x=>x.name&&/^https?:\/\//.test(x.url));iptvStatus.textContent='IPTV: '+remoteChannels.length+' каналів (доступність залежить від джерела)';render();}catch(e){iptvStatus.textContent='Плейлист недоступний: '+e.message;}finally{iptvButton.disabled=false;}}iptvButton.onclick=refreshIptv;document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshIptv()});setInterval(()=>{if(!document.hidden)refreshIptv()},60*60*1000);const list=document.getElementById('list'),q=document.getElementById('q'),v=document.getElementById('v'),status=document.getElementById('status');v.addEventListener('playing',()=>{v.classList.add('is-playing');if(window.tvSourceTimer){clearTimeout(window.tvSourceTimer);window.tvSourceTimer=null;}});v.addEventListener('pause',()=>v.classList.remove('is-playing'));v.addEventListener('ended',()=>v.classList.remove('is-playing'));let fav=new Set(JSON.parse(localStorage.getItem('fav')||'[]')),hls;window.tvPlayToken=0;window.tvSourceTimer=null;const fullscreenBtn=document.getElementById('fullscreenbtn'),playerWrap=document.getElementById('playerwrap');function updateFullscreenButton(){const active=!!document.fullscreenElement||playerWrap.classList.contains('web-fullscreen');fullscreenBtn.textContent=active?'⤢':'⛶';fullscreenBtn.title=active?'Згорнути':'На весь екран';fullscreenBtn.setAttribute('aria-label',fullscreenBtn.title)}function exitWebFullscreen(){playerWrap.classList.remove('web-fullscreen','fill-screen');document.body.classList.remove('web-fullscreen-active');updateFullscreenButton()}fullscreenBtn.onclick=async()=>{try{if(document.fullscreenElement){await document.exitFullscreen();exitWebFullscreen();return}if(playerWrap.classList.contains('web-fullscreen')){exitWebFullscreen();return}playerWrap.classList.add('fill-screen');if(playerWrap.requestFullscreen){try{await playerWrap.requestFullscreen();updateFullscreenButton();return}catch(e){/* WebView or browser may reject Fullscreen API: use fixed overlay */}}playerWrap.classList.add('web-fullscreen');document.body.classList.add('web-fullscreen-active');updateFullscreenButton()}catch(e){playerWrap.classList.add('web-fullscreen');document.body.classList.add('web-fullscreen-active');updateFullscreenButton()}};document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){playerWrap.classList.remove('fill-screen');exitWebFullscreen()}else updateFullscreenButton()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&playerWrap.classList.contains('web-fullscreen'))exitWebFullscreen()});let tvPlaybackStarted=false;function syncTvOrientation(){const landscape=window.matchMedia('(orientation: landscape)').matches;document.body.classList.toggle('tv-landscape',landscape&&tvPlaybackStarted&&!window.Capacitor?.isNativePlatform?.());if(landscape&&tvPlaybackStarted&&!window.Capacitor?.isNativePlatform?.()&&document.fullscreenEnabled&&!document.fullscreenElement){v.requestFullscreen().catch(()=>{});}else if(!landscape&&document.fullscreenElement===v){document.exitFullscreen().catch(()=>{});}}window.addEventListener('resize',syncTvOrientation);window.addEventListener('orientationchange',syncTvOrientation);v.addEventListener('play',()=>{tvPlaybackStarted=true;syncTvOrientation()});v.addEventListener('pause',()=>{if(!v.seeking){tvPlaybackStarted=false;syncTvOrientation()}});function render(){list.replaceChildren();[...new Set([...names,...remoteChannels.map(c=>c.name)])].filter(n=>n.toLowerCase().includes(q.value.toLowerCase())).sort((a,b)=>Number(fav.has(b))-Number(fav.has(a))).forEach(n=>{let row=document.createElement('div');row.className='item';let p=document.createElement('button');p.className='play';p.textContent=n+((urls[n]||remoteChannels.some(c=>c.name===n))?'':' · немає потоку');p.onclick=()=>{window.tvPlayToken++;if(window.tvSourceTimer){clearTimeout(window.tvSourceTimer);window.tvSourceTimer=null;}if(hls){hls.destroy();hls=null}v.pause();v.removeAttribute('src');v.load();let candidates=[...new Set([...(n==='Мега'?[urls[n]]:[]),...remoteChannels.filter(c=>c.name===n).map(c=>c.url),...(n==='Мега'?[]:[urls[n]])].filter(Boolean))];let url=candidates[0];if(!url){status.textContent='Потік ще не підключений';return}status.textContent=n+' — підключення…';if(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()){window.Capacitor.Plugins.NativeTv.play({url:url,urls:candidates,name:n}).then(()=>{status.textContent=n+' — відкрито у плеєрі'}).catch(e=>{status.textContent='Помилка плеєра: '+e.message});return;}let sourceIndex=0,playToken=window.tvPlayToken;function trySource(){if(playToken!==window.tvPlayToken)return;if(window.tvSourceTimer){clearTimeout(window.tvSourceTimer);window.tvSourceTimer=null;}if(hls){hls.destroy();hls=null}v.pause();v.removeAttribute('src');v.load();if(sourceIndex>=candidates.length){status.textContent=n+' — доступні джерела не відтворюються';return}const current=candidates[sourceIndex++];window.tvSourceTimer=setTimeout(()=>{if(playToken===window.tvPlayToken&&v.readyState<2){status.textContent='Час очікування вичерпано, інше джерело…';trySource()}},18000);status.textContent=n+' — джерело '+sourceIndex+'/'+candidates.length+'…';if(window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(current);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,()=>{if(playToken===window.tvPlayToken)v.play().catch(()=>{status.textContent='Натисніть ▶ для запуску'})});hls.on(Hls.Events.ERROR,(_,e)=>{if(e.fatal&&playToken===window.tvPlayToken){status.textContent='Помилка потоку, пробуємо інше джерело…';trySource()}})}else{v.src=current;v.play().catch(()=>{status.textContent='Натисніть ▶ для запуску'})}}trySource()};let s=document.createElement('button');s
