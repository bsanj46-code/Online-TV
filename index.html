<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Онлайн ТВ</title><style>body{margin:0;background:#101521;color:#fff;font:16px system-ui}header{padding:18px;background:#202b45;font-size:23px}main{padding:12px}video{width:100%;aspect-ratio:16/9;background:black;border-radius:12px}input{padding:13px;width:100%;box-sizing:border-box;background:#252e42;color:white;border:1px solid #65718c;border-radius:10px;margin:12px 0}.item{display:flex;align-items:center;background:#20283b;border-radius:10px;margin:6px 0}.item button{border:0;background:none;color:white;padding:14px;text-align:left;font-size:16px}.item .play{flex:1}.item .star{font-size:24px;color:#ffd34c}.muted{color:#a9b4c9;font-size:13px}#status{padding:8px}</style></head><body><header>📺 Онлайн ТВ</header><main><video id="v" controls playsinline></video><div id="status">Оберіть канал</div><input id="q" placeholder="🔎 Пошук каналу"><button id="loadiptv" style="width:100%;padding:14px;background:#294c79;color:white;border:0;border-radius:10px;font-size:16px;margin-bottom:12px">📡 Завантажити канали IPTV України</button><div id="iptvstatus" class="muted"></div><div id="list"></div><p class="muted">Власник і розробник — Башаєв О.С. Наявність каналу не гарантує доступність потоку.</p></main><script src="hls.min.js"></script><script>const names=["Факти ICTV","ICTV2","Мега","2+2","Новий канал","НСТ","Шокуюче HD","Кінопрем’єра","Кіномікс","Кінокомедія","Єврокіно","Чоловіче кіно","Кіносім’я","Кінопобачення","viju+ Premiere","viju+ Megahit","viju+ Comedy","Дом кіно Преміум","TV1000","Кінохіт","Discovery Channel","T24 — Технології","Перший автомобільний","Кіно жахів","Наука","TV1000 Action","РАЗ 3 — Гумор","1+1 Україна","Інтер","ТЕТ","К1","НТН","Enter-фільм","М1","Перший","Армія ТБ","Піксель TV","Суспільне Київ","ДІМ","ГІТ","Телеканал РАІ","Суспільне Культура","Суспільне Спорт","Київ 24","Тернопіль 1","Перший міський Одеса"];const urls={"Суспільне Культура":"http://stream.mcquack.net/435/index.m3u8","Суспільне Спорт":"http://cdnua05.hls.tv/934/hls/8743361621b245838bee193c9ec28322/4856/stream.m3u8","Київ 24":"https://ext.cdn.nashnet.tv/228.0.0.15/index.m3u8","Тернопіль 1":"https://ott.columbus.te.ua/ternopil1/index.m3u8","Перший міський Одеса":"https://live.1tv.od.ua/stream1/channel1/playlist.m3u8","Перший":"https://api-tv.ipnet.ua/api/v1/manifest/2118742505.m3u8","Армія ТБ":"https://api-tv.ipnet.ua/api/v1/manifest/2118742632.m3u8","Піксель TV":"https://cdn15.live-tv.cloud/ua_infinitas_tv/pixel-abr/playlist.m3u8","Суспільне Київ":"https://live-nstu.cdn-03.cosmonova.net.ua/mobile-app/main/nstu-kyiv/master.m3u8","ДІМ":"https://dash2.antik.sk/live/telekanal_dim/playlist.m3u8","ГІТ":"https://stream.uagit.tv/gittv.m3u8","Телеканал РАІ":"https://stream.rai.ua/rai/stream.m3u8","Мега":"https://cdn15.live-tv.cloud/ua_infinitas_tv/mega-abr/playlist.m3u8","НТН":"https://cdn15.live-tv.cloud/ua_infinitas_tv/ntn-abr/playlist.m3u8","TV1000 Action":"https://stream8.cinerama.uz/1225/tracks-v1a1/mono.m3u8","РАЗ 3 — Гумор":"https://dash2.antik.sk/live/kvartal_tv/playlist.m3u8","Наука":"http://stream.mcquack.net/403/index.m3u8","Факти ICTV":"http://stream.mcquack.net/158/index.m3u8","ICTV2":"http://cdnua05.hls.tv/919/hls/8743361621b245838bee193c9ec28322/4835/stream.m3u8","2+2":"http://stream.mcquack.net/173/index.m3u8","Новий канал":"http://stream.mcquack.net/157/index.m3u8","1+1 Україна":"http://stream.mcquack.net/219/index.m3u8","Інтер":"http://stream.mcquack.net/174/index.m3u8","ТЕТ":"http://stream.mcquack.net/338/index.m3u8","К1":"http://stream.mcquack.net/270/index.m3u8","Enter-фільм":"http://stream.mcquack.net/322/index.m3u8","М1":"http://stream.mcquack.net/218/index.m3u8"};const playlistUrl="https://iptv.org.ua/iptv/ua.m3u";let remoteChannels=[];const iptvButton=document.getElementById('loadiptv'),iptvStatus=document.getElementById('iptvstatus');async function refreshIptv(){iptvButton.disabled=true;iptvStatus.textContent='Завантаження плейлиста…';try{let items;if(window.Capacitor?.isNativePlatform?.()){let result=await window.Capacitor.Plugins.NativeTv.playlist();items=result.channels;}else{let response=await fetch(playlistUrl);if(!response.ok)throw Error('HTTP '+response.status);let txt=await response.text();items=[];let name=null;for(let line of txt.split(/\r?\n/)){line=line.trim();if(line.startsWith('#EXTINF:'))name=line.split(',').slice(1).join(',').trim();else if(name&&/^https?:\/\//.test(line)){items.push({name,url:line});name=null;}}}remoteChannels=(items||[]).filter(x=>x.name&&/^https?:\/\//.test(x.url));iptvStatus.textContent='IPTV: '+remoteChannels.length+' каналів (доступність залежить від джерела)';render();}catch(e){iptvStatus.textContent='Плейлист недоступний: '+e.message;}finally{iptvButton.disabled=false;}}iptvButton.onclick=refreshIptv;document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshIptv()});setInterval(()=>{if(!document.hidden)refreshIptv()},60*60*1000);const list=document.getElementById('list'),q=document.getElementById('q'),v=document.getElementById('v'),status=document.getElementById('status');let fav=new Set(JSON.parse(localStorage.getItem('fav')||'[]')),hls;function render(){list.replaceChildren();[...new Set([...names,...remoteChannels.map(c=>c.name)])].filter(n=>n.toLowerCase().includes(q.value.toLowerCase())).sort((a,b)=>Number(fav.has(b))-Number(fav.has(a))).forEach(n=>{let row=document.createElement('div');row.className='item';let p=document.createElement('button');p.className='play';p.textContent=n+((urls[n]||remoteChannels.some(c=>c.name===n))?'':' · немає потоку');p.onclick=()=>{if(hls){hls.destroy();hls=null}v.pause();v.removeAttribute('src');v.load();let candidates=[...new Set([...remoteChannels.filter(c=>c.name===n).map(c=>c.url),urls[n]].filter(Boolean))];let url=candidates[0];if(!url){status.textContent='Потік ще не підключений';return}status.textContent=n+' — підключення…';if(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()){window.Capacitor.Plugins.NativeTv.play({url:url,urls:candidates,name:n}).then(()=>{status.textContent=n+' — відкрито у плеєрі'}).catch(e=>{status.textContent='Помилка плеєра: '+e.message});return;}if(window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(url);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{status.textContent='Натисніть ▶ для запуску'}));hls.on(Hls.Events.ERROR,(_,e)=>{if(e.fatal)status.textContent='Помилка HLS: '+e.details});}else{v.src=url;v.play().catch(()=>{})}};let s=document.createElement('button');s.className='star';s.textContent=fav.has(n)?'★':'☆';s.onclick=()=>{fav.has(n)?fav.delete(n):fav.add(n);localStorage.setItem('fav',JSON.stringify([...fav]));render()};row.append(p,s);list.append(row)})}q.oninput=render;render();refreshIptv();</script></body></html>
