name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub Ubuntu runners already provide Android SDK; avoid setup-android sdkmanager failure.
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Allow HTTP streams in Android WebView
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('<application ', '<application android:usesCleartextTraffic="true" ', 1)
          if 'android.permission.INTERNET' not in s:
              s=s.replace('<application ', '<uses-permission android:name="android.permission.INTERNET" />\n    <application ', 1)
          p.write_text(s)
          PY
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: online-tv-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
