name: Publish Online TV web
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'build.mjs'
      - 'player.test.mjs'
      - '.github/workflows/deploy-web.yml'
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: online-tv-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./www
      - id: deployment
        uses: actions/deploy-pages@v4

# Redeploy GitHub Pages after enabling public Pages.

