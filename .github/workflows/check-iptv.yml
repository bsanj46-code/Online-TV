name: Check IPTV sources
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test channel streams
        run: |
          python3 - <<'PY'
          import re,urllib.request,urllib.error,csv,html,subprocess
          from pathlib import Path
          page=Path('index.html').read_text()
          section=page.split('const urls=',1)[1].split(';const playlistUrl=',1)[0]
          import json
          channels=json.loads(section)
          names_section=page.split('const names=',1)[1].split(';const urls=',1)[0]
          names=json.loads(names_section)
          rows=[]
          for name in names:
              if name not in channels:
                  rows.append([name,'NO_FIXED_SOURCE','', 'May be available only through the dynamically loaded IPTV playlist'])
          for name,url in channels.items():
              status='UNAVAILABLE';detail=''
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'})
                  with urllib.request.urlopen(req,timeout=8) as resp:
                      body=resp.read(4096)
                      status='HLS_MANIFEST' if b'#EXTM3U' in body else 'UNVERIFIED'
                      detail=str(resp.status)+' '+str(resp.headers.get('Content-Type',''))
              except Exception as exc:
                  detail=str(exc)[:160]
              if status=='HLS_MANIFEST':
                  try:
                      probe=subprocess.run(['ffprobe','-v','error','-rw_timeout','7000000','-analyzeduration','3000000','-probesize','300000','-show_entries','stream=codec_type','-of','csv=p=0',url],capture_output=True,text=True,timeout=14)
                      status='MEDIA_DETECTED' if probe.returncode==0 and ('video' in probe.stdout or 'audio' in probe.stdout) else 'MANIFEST_ONLY'
                      detail+=' | '+(probe.stderr or probe.stdout)[:140]
                  except Exception as exc:
                      status='MANIFEST_ONLY';detail+=' | ffprobe: '+str(exc)[:100]
              rows.append([name,status,url,detail])
          with open('iptv-source-report.csv','w',newline='',encoding='utf-8') as f:
              writer=csv.writer(f);writer.writerow(['channel','result','url','details']);writer.writerows(rows)
          print('Media detected:',sum(r[1]=='MEDIA_DETECTED' for r in rows),'/',len(channels))
          print('No fixed source:',sum(r[1]=='NO_FIXED_SOURCE' for r in rows))
          print('NOTE: Results are server-side probes, not proof of playback on Android devices.')
          for row in rows: print(row[0],row[1],row[3])
          if not any(row[1]=='MEDIA_DETECTED' for row in rows):
              raise SystemExit('IPTV validation failed: no fixed channel media streams detected')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-source-report
          path: iptv-source-report.csv
